<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <title>Frontend Mentor | IP Address Tracker</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution {
      font-size: 0.6875rem;
      text-align: center;
    }

    .attribution a {
      color: hsl(228, 45%, 44%);
    }
  </style>
</head>

<body>

  <h1>IP Address Tracker</h1>

  <form id="search-form">
    <label for="ip-address">IP address or domain</label>

    <input type="text" id="ip-address" name="ip-address" placeholder="Search for any IP address or domain" required>

    <button type="submit">Search</button>
  </form>

  
 <section id="results" aria-label="IP address lookup results">
  <div>
    <h2>IP Address</h2>
    <p id="result-ip">—</p>
  </div>

   <div>
    <h2>Location</h2>
    <p id="result-location">—</p>
  </div>

   <div>
    <h2>Timezone</h2>
    <p id="result-timezone">UTC —</p> <!-- add offset value dynamically using the API -->
  </div>

   <div>
    <h2>ISP</h2>
    <p id="result-isp">—</p> 
  </div>

</section>

<div id="map" aria-label="Map showing the IP address location"></div>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="#">Ebony Mitchell</a>.
  </footer>
</body>

</html>
